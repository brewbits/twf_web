<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Warehouse Inventory Lookup</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel-2: #22262f;
    --border: #2e333d;
    --text: #f1f3f6;
    --text-dim: #9aa2ad;
    --accent: #4f8cff;
    --good: #2fbf71;
    --bad: #ef4444;
    --warn: #f5a524;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  .wrap { width: 100%; max-width: 640px; }

  h1 {
    font-size: 1.25rem;
    margin: 4px 0 14px;
    text-align: center;
    font-weight: 600;
  }
  .version-tag {
    font-size: 0.65rem;
    font-weight: 400;
    color: var(--text-dim);
    vertical-align: middle;
    margin-left: 6px;
  }

  .status-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 14px;
  }
  .status-bar button {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 6px; padding: 4px 8px; font-size: 0.75rem; cursor: pointer;
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .status-dot.ok { background: var(--good); }
  .status-dot.bad { background: var(--bad); }
  .status-dot.loading { background: var(--warn); }

  .scan-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }

  .search-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .search-panel label {
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  #searchInput {
    width: 100%;
    font-size: 1rem;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    outline: none;
  }
  #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,140,255,0.25); }
  .scan-panel label {
    display: block;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  #scanInput {
    width: 100%;
    font-size: 1.4rem;
    padding: 14px 14px;
    border-radius: 10px;
    border: 2px solid var(--accent);
    background: var(--panel-2);
    color: var(--text);
    outline: none;
  }
  #scanInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,140,255,0.25); }

  .row-buttons { display: flex; gap: 10px; margin-top: 12px; }
  .btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 0.95rem;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn:active { transform: scale(0.98); }

  #cameraPanel {
    display: none;
    margin-top: 12px;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    background: #000;
  }
  #cameraPanel.active { display: block; }
  #video { width: 100%; display: block; max-height: 360px; object-fit: cover; }
  .camera-hint {
    position: absolute; bottom: 8px; left: 0; right: 0;
    text-align: center; font-size: 0.75rem; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }

  #result { min-height: 40px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .card.item { border-left: 4px solid var(--accent); }
  .card.location { border-left: 4px solid var(--good); }
  .card.notfound { border-left: 4px solid var(--bad); }

  .card h2 {
    margin: 0 0 4px;
    font-size: 1.1rem;
  }
  .card .sub {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-bottom: 12px;
  }
  .breadcrumb {
    color: var(--text-dim);
    font-size: 0.8rem;
    margin-bottom: 10px;
  }
  .breadcrumb.small { margin-bottom: 0; margin-top: 2px; font-size: 0.72rem; }
  .description {
    font-size: 0.9rem;
    color: var(--text);
    background: var(--panel-2);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 12px;
  }
  .loc-divider {
    border: none;
    border-top: 1px dashed var(--border);
    margin: 14px 0;
  }
  .kv { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--text-dim); }
  .kv .v { font-weight: 600; text-align: right; }
  .kv .v.unassigned { color: var(--warn); font-weight: 400; }

  .item-list { margin-top: 4px; }
  .item-row {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  .item-row:last-child { border-bottom: none; }
  .item-row .name-col { flex: 1; min-width: 0; }
  .item-row .shelf-tag {
    font-size: 0.7rem; color: var(--text-dim); background: var(--panel-2);
    border-radius: 6px; padding: 1px 6px; margin-left: 6px;
  }
  .item-row .qty { color: var(--text-dim); white-space: nowrap; }
  .item-row.clickable { cursor: pointer; }
  .item-row.clickable:active { background: var(--panel-2); }
  .empty-note { color: var(--text-dim); font-size: 0.9rem; }
  .search-note { color: var(--text-dim); font-size: 0.8rem; margin-top: 10px; }
  .back-link {
    display: inline-block;
    color: var(--accent);
    font-size: 0.85rem;
    margin-bottom: 12px;
    cursor: pointer;
    text-decoration: none;
  }
  .back-link:active { opacity: 0.7; }

  .footer-note { text-align: center; color: var(--text-dim); font-size: 0.75rem; margin-top: 8px; }

  .file-age {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.78rem;
    margin: -6px 0 14px;
  }
  .file-age.stale { color: var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Warehouse Inventory Lookup<span class="version-tag" id="versionTag"></span></h1>

  <div class="status-bar">
    <span id="statusText"><span class="status-dot loading"></span>Loading inventory…</span>
    <button id="refreshBtn">Refresh</button>
  </div>
  <div class="file-age" id="fileAgeText"></div>

  <div class="scan-panel">
    <label for="scanInput">Scan or type a code, then press Enter</label>
    <input id="scanInput" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. SHCK4T0150 or PER-A-R04">
    <div class="row-buttons">
      <button class="btn primary" id="lookupBtn">Look up</button>
      <button class="btn" id="cameraBtn">Scan with camera</button>
    </div>
    <div id="cameraPanel">
      <video id="video" muted playsinline></video>
      <div class="camera-hint">Point the camera at a QR code</div>
    </div>
  </div>

  <div class="search-panel">
    <label for="searchInput">Search by name, description, part number, or SID</label>
    <input id="searchInput" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. post beam, baseplate, 4T0150">
    <button class="btn primary" id="searchBtn">Search</button>
  </div>

  <div id="result"></div>
  <div class="footer-note" id="footerNote">Data source: brewbits/twf · inventory_full.xlsx</div>
</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
const APP_VERSION = "0.9";
const DATA_URL = "https://raw.githubusercontent.com/brewbits/twf/main/inventory_full.xlsx";

const COL = {
  name: "Entry Name",
  type: "Entry Type",       // may be absent in newer exports - handled defensively below
  sid: "SID",
  qty: "Quantity",
  unit: "Unit",
  notes: "Notes",
  description: "Add description here",
  primaryFolder: "Primary Folder",
  sub1: "Subfolder-level1",
  sub2: "Subfolder-level2",
  sub3: "Subfolder-level3",
  sub4: "Subfolder-level4",
  rack: "Pick - Rack",
  shelf: "Pick - Shelf",
  modelPart: "Model/Part Number",
};

const SEARCH_FIELDS = [COL.name, COL.description, COL.modelPart, COL.sid];
const SEARCH_MIN_CHARS = 2;
const SEARCH_RESULT_CAP = 30;

function folderBreadcrumb(r) {
  const parts = [COL.primaryFolder, COL.sub1, COL.sub2, COL.sub3, COL.sub4]
    .map(key => String(r[key] || '').trim())
    .filter(v => v && v.toUpperCase() !== 'NOT ASSIGNED');
  return parts;
}

let rows = [];
let sidIndex = new Map();     // SID (upper) -> row, Entry Type = Item
let bayIndex = new Map();     // BAY (upper) -> [rows]
let bayShelfIndex = new Map(); // BAY|SHELF (upper) -> [rows]
let fileTimestamp = null;     // Date the xlsx itself reports as its last-modified time (its own embedded metadata, not when we happened to fetch it)

const STALE_AFTER_MS = 7 * 24 * 60 * 60 * 1000; // flag the age line if the file hasn't been refreshed in over a week

const statusText = document.getElementById('statusText');
const fileAgeText = document.getElementById('fileAgeText');
const resultEl = document.getElementById('result');
const scanInput = document.getElementById('scanInput');

function setStatus(kind, text) {
  const dotClass = kind === 'ok' ? 'ok' : kind === 'error' ? 'bad' : 'loading';
  statusText.innerHTML = `<span class="status-dot ${dotClass}"></span>${text}`;
}

function formatRelativeAge(date) {
  const diffMs = Date.now() - date.getTime();
  const minutes = Math.floor(diffMs / 60000);
  const hours = Math.floor(diffMs / 3600000);
  const days = Math.floor(diffMs / 86400000);

  if (minutes < 1) return 'just now';
  if (minutes < 60) return `${minutes} minute${minutes === 1 ? '' : 's'} ago`;
  if (hours < 24) return `${hours} hour${hours === 1 ? '' : 's'} ago`;
  return `${days} day${days === 1 ? '' : 's'} ago`;
}

function updateFileAgeDisplay() {
  if (!fileTimestamp) {
    fileAgeText.textContent = '';
    fileAgeText.classList.remove('stale');
    return;
  }
  const isStale = (Date.now() - fileTimestamp.getTime()) > STALE_AFTER_MS;
  fileAgeText.classList.toggle('stale', isStale);
  fileAgeText.textContent = `Inventory file last updated ${formatRelativeAge(fileTimestamp)}`;
  fileAgeText.title = fileTimestamp.toLocaleString();
}
setInterval(updateFileAgeDisplay, 30000); // keep the relative time accurate without needing a refresh

function isAssigned(v) {
  if (v === undefined || v === null) return false;
  const s = String(v).trim();
  if (!s) return false;
  return s.toUpperCase() !== 'NOT ASSIGNED';
}

async function loadData() {
  setStatus('loading', 'Loading inventory…');
  try {
    // raw.githubusercontent.com sits behind a CDN that caches content for a
    // few minutes at the edge, independent of the browser's own cache - a
    // cache-busting query param forces a fresh fetch from origin every time
    // rather than occasionally serving a stale file right after an upload.
    const resp = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const buf = await resp.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

    // The file's own embedded "modified" timestamp (from Excel's docProps/
    // core.xml) reflects when this export was actually last saved - more
    // reliable than "created", which real exports have shown can predate
    // "modified" by hours (the file object isn't necessarily freshly
    // created from scratch on every export). Falls back to "created" only
    // if "modified" is missing.
    const props = wb.Props || {};
    fileTimestamp = (props.ModifiedDate instanceof Date) ? props.ModifiedDate
      : (props.CreatedDate instanceof Date) ? props.CreatedDate
      : null;
    updateFileAgeDisplay();

    sidIndex = new Map();
    bayIndex = new Map();
    bayShelfIndex = new Map();

    for (const r of rows) {
      const sid = String(r[COL.sid] || '').trim();
      const rawType = r[COL.type];
      // Older exports had an "Entry Type" column distinguishing Item/Folder rows.
      // Newer exports omit it entirely (every row is an item) - only exclude a
      // row when that column is present AND explicitly says "Folder".
      const isFolder = rawType !== undefined && String(rawType).trim() === 'Folder';
      const rack = String(r[COL.rack] || '').trim();
      const shelf = String(r[COL.shelf] || '').trim();

      if (sid && !isFolder) {
        // The same SID legitimately appears more than once - Sortly tracks
        // it as a separate stock record per warehouse/location - so this
        // must accumulate every matching row, not overwrite to just one.
        const sidKey = sid.toUpperCase();
        if (!sidIndex.has(sidKey)) sidIndex.set(sidKey, []);
        sidIndex.get(sidKey).push(r);
      }
      if (isAssigned(rack)) {
        const rackKey = rack.toUpperCase();
        if (!bayIndex.has(rackKey)) bayIndex.set(rackKey, []);
        bayIndex.get(rackKey).push(r);

        if (isAssigned(shelf)) {
          const combo = rackKey + '|' + shelf.toUpperCase();
          if (!bayShelfIndex.has(combo)) bayShelfIndex.set(combo, []);
          bayShelfIndex.get(combo).push(r);
        }
      }
    }

    const now = new Date().toLocaleTimeString();
    setStatus('ok', `Loaded ${rows.length} rows · ${now}`);
  } catch (err) {
    console.error(err);
    setStatus('error', 'Failed to load inventory data (' + err.message + ')');
  }
}

function renderNotFound(code) {
  resultEl.innerHTML = `
    <div class="card notfound">
      <h2>Not found</h2>
      <div class="sub">No item or location matches this code.</div>
      <div class="kv"><span class="k">Scanned text</span><span class="v">${escapeHtml(code)}</span></div>
    </div>`;
}

function renderItem(records, opts = {}) {
  // The same SID can legitimately appear as more than one stock record
  // (e.g. the same item held in both Perth and Bunbury warehouses), so this
  // always renders a list of one-or-more location blocks, never assumes one.
  const first = records[0];
  const name = String(first[COL.name] || '(unnamed item)');
  const sid = String(first[COL.sid] || '');
  const unit = String(first[COL.unit] || '');

  const descriptions = [...new Set(records.map(r => String(r[COL.description] || '').trim()).filter(Boolean))];
  const sharedDescription = descriptions.length === 1 ? descriptions[0] : null;

  const totalQty = records.reduce((sum, r) => {
    const n = Number(r[COL.qty]);
    return sum + (Number.isFinite(n) ? n : 0);
  }, 0);

  const locationsHtml = records.map(r => {
    const rack = String(r[COL.rack] || '').trim();
    const shelf = String(r[COL.shelf] || '').trim();
    const rackAssigned = isAssigned(rack);
    const shelfAssigned = isAssigned(shelf);
    const breadcrumb = folderBreadcrumb(r);
    const rowDescription = sharedDescription === null ? String(r[COL.description] || '').trim() : '';

    return `
      <div class="loc-block">
        ${breadcrumb.length ? `<div class="breadcrumb">${breadcrumb.map(escapeHtml).join(' &rsaquo; ')}</div>` : ''}
        ${rowDescription ? `<div class="description">${escapeHtml(rowDescription)}</div>` : ''}
        <div class="kv"><span class="k">Rack</span><span class="v ${rackAssigned ? '' : 'unassigned'}">${rackAssigned ? escapeHtml(rack) : 'Not assigned'}</span></div>
        <div class="kv"><span class="k">Shelf</span><span class="v ${shelfAssigned ? '' : 'unassigned'}">${shelfAssigned ? escapeHtml(shelf) : 'Not assigned'}</span></div>
        <div class="kv"><span class="k">Quantity</span><span class="v">${escapeHtml(String(r[COL.qty] ?? ''))} ${escapeHtml(unit)}</span></div>
        ${r[COL.notes] ? `<div class="kv"><span class="k">Notes</span><span class="v">${escapeHtml(String(r[COL.notes]))}</span></div>` : ''}
      </div>`;
  }).join('<hr class="loc-divider">');

  const backLink = opts.fromSearch
    ? `<a class="back-link" id="backToSearchLink">&larr; Back to search results</a>`
    : '';

  resultEl.innerHTML = `
    ${backLink}
    <div class="card item">
      <h2>${escapeHtml(name)}</h2>
      <div class="sub">SID ${escapeHtml(sid)}${records.length > 1 ? ` · ${records.length} stock locations · total ${totalQty} ${escapeHtml(unit)}` : ''}</div>
      ${sharedDescription ? `<div class="description">${escapeHtml(sharedDescription)}</div>` : ''}
      ${locationsHtml}
    </div>`;

  if (opts.fromSearch) {
    document.getElementById('backToSearchLink').addEventListener('click', renderSearchResults);
  }
}

function renderLocation(title, subtitle, items) {
  let body;
  if (!items || items.length === 0) {
    body = `<div class="empty-note">No items currently recorded at this location.</div>`;
  } else {
    body = `<div class="item-list">` + items.map(r => {
      const breadcrumb = folderBreadcrumb(r);
      return `
      <div class="item-row">
        <div class="name-col">
          <span class="name">${escapeHtml(String(r[COL.name] || ''))}${
            subtitle === 'ALL_SHELVES' && isAssigned(r[COL.shelf])
              ? `<span class="shelf-tag">Shelf ${escapeHtml(String(r[COL.shelf]))}</span>` : ''
          }</span>
          ${breadcrumb.length ? `<div class="breadcrumb small">${breadcrumb.map(escapeHtml).join(' &rsaquo; ')}</div>` : ''}
        </div>
        <span class="qty">${escapeHtml(String(r[COL.qty] ?? ''))} ${escapeHtml(String(r[COL.unit] || ''))}</span>
      </div>`;
    }).join('') + `</div>`;
  }

  resultEl.innerHTML = `
    <div class="card location">
      <h2>${escapeHtml(title)}</h2>
      <div class="sub">${items.length} item${items.length === 1 ? '' : 's'}</div>
      ${body}
    </div>`;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function extractCode(raw) {
  // Some labels are scanned by apps (e.g. Sortly) that wrap the real code in
  // their own URI, like "sy://o2/m_qrcode_single/SHCK4T0150". Our own codes
  // (SIDs, rack/shelf codes) never contain "/", so if one shows up, the real
  // code is whatever follows the last "/".
  const trimmed = String(raw || '').trim();
  const slashIdx = trimmed.lastIndexOf('/');
  return slashIdx === -1 ? trimmed : trimmed.slice(slashIdx + 1);
}

function handleScan(raw) {
  const code = extractCode(raw);
  if (!code) return;
  const upper = code.toUpperCase();

  // 1. Item lookup by SID
  if (sidIndex.has(upper)) {
    renderItem(sidIndex.get(upper));
    return;
  }

  // 2. Bay + shelf combined code, e.g. PER-A-R04-01 (split on last "-NN")
  const shelfSplit = upper.match(/^(.+)-(\d{2})$/);
  if (shelfSplit) {
    const bayPart = shelfSplit[1];
    const shelfPart = shelfSplit[2];
    const combo = bayPart + '|' + shelfPart;
    if (bayShelfIndex.has(combo)) {
      renderLocation(`Rack ${bayPart}, Shelf ${shelfPart}`, 'ONE_SHELF', bayShelfIndex.get(combo));
      return;
    }
  }

  // 3. Bay only, e.g. PER-A-R04
  if (bayIndex.has(upper)) {
    renderLocation(`Rack ${upper} (all shelves)`, 'ALL_SHELVES', bayIndex.get(upper));
    return;
  }

  // 4. Nothing matched
  renderNotFound(code);
}

// ---- free-text search ----
let lastSearchState = null; // { query, matchedSids: [...] } or null when no active search

function performSearch(rawQuery) {
  const query = rawQuery.trim();
  if (query.length < SEARCH_MIN_CHARS) {
    lastSearchState = null;
    resultEl.innerHTML = `<div class="empty-note">Type at least ${SEARCH_MIN_CHARS} characters to search.</div>`;
    return;
  }

  // Multi-word queries don't require the exact phrase: every word must
  // appear SOMEWHERE across the combined searchable fields, in any order
  // and even in different fields - "beam aluminum" and "aluminum beam"
  // match the same items, and a word in the description can pair with a
  // word only found in the name. A single-word query behaves exactly like
  // before (a plain substring match).
  const words = query.toLowerCase().split(/\s+/).filter(Boolean);
  const matchedSids = [];
  const seen = new Set();
  for (const r of rows) {
    const haystack = SEARCH_FIELDS.map(field => String(r[field] || '')).join(' ').toLowerCase();
    const hit = words.every(w => haystack.includes(w));
    if (!hit) continue;
    const sidKey = String(r[COL.sid] || '').trim().toUpperCase();
    if (sidKey && !seen.has(sidKey)) {
      seen.add(sidKey);
      matchedSids.push(sidKey);
    }
  }

  lastSearchState = { query, matchedSids };
  renderSearchResults();
}

function renderSearchResults() {
  if (!lastSearchState) return;
  const { query, matchedSids } = lastSearchState;

  if (matchedSids.length === 0) {
    resultEl.innerHTML = `<div class="empty-note">No items match "${escapeHtml(query)}".</div>`;
    return;
  }

  const shown = matchedSids.slice(0, SEARCH_RESULT_CAP);
  const rowsHtml = shown.map(sidKey => {
    const records = sidIndex.get(sidKey) || [];
    const first = records[0];
    if (!first) return '';
    const name = String(first[COL.name] || '(unnamed item)');
    const totalQty = records.reduce((sum, r) => {
      const n = Number(r[COL.qty]);
      return sum + (Number.isFinite(n) ? n : 0);
    }, 0);
    const unit = String(first[COL.unit] || '');
    const breadcrumb = folderBreadcrumb(first);

    return `
      <div class="item-row clickable" data-sid="${escapeHtml(sidKey)}">
        <div class="name-col">
          <span class="name">${escapeHtml(name)}</span>
          <div class="breadcrumb small">SID ${escapeHtml(sidKey)}${records.length > 1 ? ` &middot; ${records.length} locations` : ''}${breadcrumb.length ? ` &middot; ${breadcrumb.map(escapeHtml).join(' &rsaquo; ')}` : ''}</div>
        </div>
        <span class="qty">${escapeHtml(String(totalQty))} ${escapeHtml(unit)}</span>
      </div>`;
  }).join('');

  const cappedNote = matchedSids.length > SEARCH_RESULT_CAP
    ? `<div class="search-note">Showing top ${SEARCH_RESULT_CAP} of ${matchedSids.length} matches - refine your search for a shorter list.</div>`
    : '';

  resultEl.innerHTML = `
    <div class="card location">
      <h2>Search results for "${escapeHtml(query)}"</h2>
      <div class="sub">${matchedSids.length} item${matchedSids.length === 1 ? '' : 's'} found</div>
      <div class="item-list">${rowsHtml}</div>
      ${cappedNote}
    </div>`;

  resultEl.querySelectorAll('.item-row.clickable').forEach(el => {
    el.addEventListener('click', () => {
      const sidKey = el.getAttribute('data-sid');
      renderItem(sidIndex.get(sidKey), { fromSearch: true });
    });
  });
}

// ---- scan input wiring ----
// The scanned/typed text is left visible in the box after a lookup (not
// cleared) so the user can confirm exactly what was captured - but with any
// wrapper prefix (e.g. Sortly's "sy://o2/m_qrcode_single/") already
// stripped via extractCode(), so what's shown matches what was matched
// against, not raw scanner/app noise. It's select()ed rather than cleared,
// so the next scan's keystrokes - from the physical scanner or the camera -
// simply replace it rather than appending to it.
scanInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const cleaned = extractCode(scanInput.value);
    scanInput.value = cleaned;
    handleScan(cleaned);
    scanInput.select();
  }
});
document.getElementById('lookupBtn').addEventListener('click', () => {
  const cleaned = extractCode(scanInput.value);
  scanInput.value = cleaned;
  handleScan(cleaned);
  scanInput.focus();
  scanInput.select();
});
document.getElementById('refreshBtn').addEventListener('click', loadData);

// ---- search input wiring ----
const searchInput = document.getElementById('searchInput');
document.getElementById('searchBtn').addEventListener('click', () => performSearch(searchInput.value));
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    performSearch(searchInput.value);
  }
});

function refocusInput() {
  // Don't steal focus while the camera panel is open or user is scrolling a result.
  if (document.getElementById('cameraPanel').classList.contains('active')) return;
  scanInput.focus();
}
document.addEventListener('click', (e) => {
  // Don't steal focus back to the scan box while the user is working with
  // the camera panel or the separate search panel/results (typing a search,
  // clicking a result row, clicking "Back to search results", etc.).
  if (e.target.closest('#cameraPanel')) return;
  if (e.target.closest('.search-panel')) return;
  if (e.target.closest('#result')) return;
  refocusInput();
});
window.addEventListener('load', refocusInput);

// ---- camera scanning ----
const cameraBtn = document.getElementById('cameraBtn');
const cameraPanel = document.getElementById('cameraPanel');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
let stream = null;
let scanning = false;
let detector = null;
if ('BarcodeDetector' in window) {
  try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; }
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  } catch (err) {
    alert('Camera access failed: ' + err.message);
    return;
  }
  video.srcObject = stream;
  await video.play();
  cameraPanel.classList.add('active');
  scanning = true;
  requestAnimationFrame(scanFrame);
}

function stopCamera() {
  scanning = false;
  cameraPanel.classList.remove('active');
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  refocusInput();
}

async function scanFrame() {
  if (!scanning) return;
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    try {
      if (detector) {
        const codes = await detector.detect(video);
        if (codes.length > 0) {
          onCameraResult(codes[0].rawValue);
          return;
        }
      } else if (window.jsQR) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if (code && code.data) {
          onCameraResult(code.data);
          return;
        }
      }
    } catch (e) { /* keep scanning */ }
  }
  requestAnimationFrame(scanFrame);
}

function onCameraResult(text) {
  stopCamera();
  // Show the cleaned code in the box (wrapper prefix stripped), matching
  // what the lookup actually matched against - not raw scanner/app noise.
  const cleaned = extractCode(text);
  scanInput.value = cleaned;
  handleScan(cleaned);
  scanInput.select();
}

cameraBtn.addEventListener('click', () => {
  if (cameraPanel.classList.contains('active')) {
    stopCamera();
  } else {
    startCamera();
  }
});

document.getElementById('versionTag').textContent = `v${APP_VERSION}`;
document.getElementById('footerNote').textContent = `v${APP_VERSION} · Data source: brewbits/twf · inventory_full.xlsx`;

loadData();
</script>
</body>
</html>
